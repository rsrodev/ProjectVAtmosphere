;///////////////////////////////////////////////////////////////////////////////
; Project V Atmosphere - High Quality Preset
; Target: Clean or lightly modded installations
; Expected cost: 8-12 FPS
;///////////////////////////////////////////////////////////////////////////////

[ProjectVAtmosphere.fx]

; Clouds
PVA_CloudCoverage=0.45
PVA_CloudDensity=1.1
PVA_CloudBase=1500.0
PVA_CloudTop=4500.0
PVA_CloudScale=1.0

; Wind
PVA_WindSpeed=8.0
PVA_WindDirection=45.0
PVA_Turbulence=1.0

; Shadows
PVA_ShadowStrength=0.7

; Reflections
PVA_ReflectionStrength=0.5

; Lighting
PVA_LightIntensity=1.0

; Performance
PVA_RaymarchSteps=64
PVA_TemporalStrength=0.88
PVA_ResolutionScale=0.5

; Features
PVA_EnableClouds=1
PVA_EnableShadows=1
PVA_EnableReflections=1
PVA_EnableFlyThrough=1
PVA_EnableTemporal=1

; Fly-Through
PVA_FogDensityMultiplier=1.2
PVA_FogMaxDistance=250.0
PVA_TransitionSmoothing=0.5
