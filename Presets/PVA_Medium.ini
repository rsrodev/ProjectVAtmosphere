;///////////////////////////////////////////////////////////////////////////////
; Project V Atmosphere - Medium Quality Preset
; Target: Moderate modpacks, RTX 3060 / RTX 5060 Laptop
; Expected cost: 5-8 FPS
;///////////////////////////////////////////////////////////////////////////////

[ProjectVAtmosphere.fx]

; Clouds
PVA_CloudCoverage=0.45
PVA_CloudDensity=1.0
PVA_CloudBase=1500.0
PVA_CloudTop=4500.0
PVA_CloudScale=1.0

; Wind
PVA_WindSpeed=8.0
PVA_WindDirection=45.0
PVA_Turbulence=0.8

; Shadows
PVA_ShadowStrength=0.6

; Reflections
PVA_ReflectionStrength=0.4

; Lighting
PVA_LightIntensity=1.0

; Performance
PVA_RaymarchSteps=48
PVA_TemporalStrength=0.90
PVA_ResolutionScale=0.5

; Features
PVA_EnableClouds=1
PVA_EnableShadows=1
PVA_EnableReflections=1
PVA_EnableFlyThrough=1
PVA_EnableTemporal=1

; Fly-Through
PVA_FogDensityMultiplier=1.0
PVA_FogMaxDistance=300.0
PVA_TransitionSmoothing=0.5
