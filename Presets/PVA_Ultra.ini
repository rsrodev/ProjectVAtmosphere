;///////////////////////////////////////////////////////////////////////////////
; Project V Atmosphere - Ultra Quality Preset
; Target: Unmodded or very lightly modded, high-end GPU
; Expected cost: 12-15 FPS
;///////////////////////////////////////////////////////////////////////////////

[ProjectVAtmosphere.fx]

; Clouds
PVA_CloudCoverage=0.45
PVA_CloudDensity=1.2
PVA_CloudBase=1500.0
PVA_CloudTop=5000.0
PVA_CloudScale=1.0

; Wind
PVA_WindSpeed=8.0
PVA_WindDirection=45.0
PVA_Turbulence=1.2

; Shadows
PVA_ShadowStrength=0.75

; Reflections
PVA_ReflectionStrength=0.6

; Lighting
PVA_LightIntensity=1.0

; Performance
PVA_RaymarchSteps=96
PVA_TemporalStrength=0.85
PVA_ResolutionScale=0.5

; Features
PVA_EnableClouds=1
PVA_EnableShadows=1
PVA_EnableReflections=1
PVA_EnableFlyThrough=1
PVA_EnableTemporal=1

; Fly-Through
PVA_FogDensityMultiplier=1.5
PVA_FogMaxDistance=200.0
PVA_TransitionSmoothing=0.4
