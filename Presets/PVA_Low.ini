;///////////////////////////////////////////////////////////////////////////////
; Project V Atmosphere - Low Quality Preset
; Target: Heavily modded installations, weaker GPUs
; Expected cost: 3-5 FPS
;///////////////////////////////////////////////////////////////////////////////

[ProjectVAtmosphere.fx]

; Clouds
PVA_CloudCoverage=0.40
PVA_CloudDensity=0.90
PVA_CloudBase=1500.0
PVA_CloudTop=4000.0
PVA_CloudScale=1.2

; Wind
PVA_WindSpeed=8.0
PVA_WindDirection=45.0
PVA_Turbulence=0.5

; Shadows
PVA_ShadowStrength=0.5

; Reflections
PVA_ReflectionStrength=0.3

; Lighting
PVA_LightIntensity=1.0

; Performance
PVA_RaymarchSteps=32
PVA_TemporalStrength=0.93
PVA_ResolutionScale=0.25

; Features
PVA_EnableClouds=1
PVA_EnableShadows=1
PVA_EnableReflections=0
PVA_EnableFlyThrough=1
PVA_EnableTemporal=1

; Fly-Through
PVA_FogDensityMultiplier=0.8
PVA_FogMaxDistance=400.0
PVA_TransitionSmoothing=0.6
